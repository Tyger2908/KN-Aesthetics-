<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact us | KN Aesthetics Studio</title>
<meta name="description" content="Find KN Aesthetics Studio, see our opening hours and send us a message.">
<meta property="og:title" content="Contact us | KN Aesthetics Studio">
<meta property="og:description" content="Find KN Aesthetics Studio, see our opening hours and send us a message.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 30V14a12 12 0 0 1 24 0v16z' fill='%238e3f5c'/%3E%3Ccircle cx='16' cy='14' r='4' fill='%23d6ae5c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">
<section class="page-top"><div class="wrap"><h1>Contact us</h1><p>Questions, ideas or a photo of the look you want: we'd love to hear from you.</p></div></section>
<section class="band"><div class="wrap form-layout">
  <form class="form" id="contact-form">
    <div class="field"><label for="c-name">Your name</label><input id="c-name" name="name" required autocomplete="name"></div>
    <div class="field"><label for="c-phone">Phone number <span class="opt">(optional)</span></label><input id="c-phone" name="phone" type="tel" autocomplete="tel"></div>
    <div class="field field-full"><label for="c-msg">Your message</label><textarea id="c-msg" name="message" required></textarea></div>
    <div class="btn-row field-full"><button class="btn" type="submit" value="whatsapp">Send on WhatsApp</button><button class="btn btn-quiet" type="submit" value="email">Send by email</button></div>
    <p class="notice form-msg" role="status" hidden></p>
  </form>
  <aside class="side">
    <div class="side-block"><h2>Get in touch</h2><p data-contact></p></div>
    <div class="side-block"><h2>Find us</h2><p data-address></p></div>
    <div class="side-block"><h2>Opening hours</h2><div data-hours></div></div>
  </aside>
</div></section>
<section class="wrap" id="map" style="padding-bottom:64px"></section>
</main>
<div id="site-footer"></div>
<noscript><p class="setup-error">Please turn on JavaScript to see our services, photos and booking form.</p></noscript>
<script src="site-settings.js"></script>
<script src="js/main.js"></script>
</body>
</html>
