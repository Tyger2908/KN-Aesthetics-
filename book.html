<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book an appointment | KN Aesthetics Studio</title>
<meta name="description" content="Request an appointment at KN Aesthetics Studio by WhatsApp or email.">
<meta property="og:title" content="Book an appointment | KN Aesthetics Studio">
<meta property="og:description" content="Request an appointment at KN Aesthetics Studio by WhatsApp or email.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 30V14a12 12 0 0 1 24 0v16z' fill='%238e3f5c'/%3E%3Ccircle cx='16' cy='14' r='4' fill='%23d6ae5c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<main id="main">
<section class="page-top"><div class="wrap"><h1>Book an appointment</h1><p>Send your request and we'll reply to confirm your time.</p></div></section>
<section class="band"><div class="wrap form-layout">
  <form class="form" id="book-form">
    <div class="field"><label for="b-name">Your name</label><input id="b-name" name="name" required autocomplete="name"></div>
    <div class="field"><label for="b-phone">Phone number</label><input id="b-phone" name="phone" type="tel" required autocomplete="tel"></div>
    <div class="field field-full"><label for="b-service">Service</label><select id="b-service" name="service" required><option value="">Choose a service</option></select></div>
    <div class="field"><label for="b-date">Date</label><input id="b-date" name="date" type="date" required><p class="help" id="date-help" role="alert"></p></div>
    <div class="field"><label for="b-time">Time</label><select id="b-time" name="time" required></select></div>
    <div class="field field-full"><label for="b-notes">Anything we should know? <span class="opt">(optional)</span></label><textarea id="b-notes" name="notes"></textarea></div>
    <div class="btn-row field-full"><button class="btn" type="submit" value="whatsapp">Send on WhatsApp</button><button class="btn btn-quiet" type="submit" value="email">Send by email</button></div>
    <p class="notice form-msg" role="status" hidden></p>
  </form>
  <aside class="side">
    <div class="side-block"><h2>Opening hours</h2><div data-hours></div></div>
    <div class="side-block"><h2>Prefer to call?</h2><p data-contact></p></div>
  </aside>
</div></section>
</main>
<div id="site-footer"></div>
<noscript><p class="setup-error">Please turn on JavaScript to see our services, photos and booking form.</p></noscript>
<script src="site-settings.js"></script>
<script src="js/main.js"></script>
</body>
</html>
